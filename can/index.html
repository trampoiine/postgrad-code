<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线控执行系统 - 简易测试装调</title>
<style>
:root { --primary: #409eff; --border: #dcdfe6; --text: #303133; --success: #67c23a; --danger: #f56c6c; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; color: var(--text); padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); overflow: hidden; }
.header { background: #2c3e50; color: #fff; padding: 15px 20px; text-align: center; font-size: 20px; font-weight: bold; letter-spacing: 2px; }
.control-panel { padding: 15px 20px; }
.control-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 14px 0; border-bottom: 1px dashed #eee; }
.control-row:last-child { border-bottom: none; }

.gear-wrapper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.gear-display {
  width: 52px; height: 52px; line-height: 52px;
  text-align: center; font-size: 26px; font-weight: bold;
  border-radius: 8px; color: #fff; background: #909399;
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  transition: all 0.3s ease; user-select: none;
}
.gear-display.gear-n { background: #909399; box-shadow: 0 3px 10px rgba(144,147,153,0.5); }
.gear-display.gear-d { background: #67c23a; box-shadow: 0 3px 10px rgba(103,194,58,0.5); }
.gear-display.gear-r { background: #e6a23c; box-shadow: 0 3px 10px rgba(230,162,60,0.5); }
.gear-display.gear-p { background: #f56c6c; box-shadow: 0 3px 10px rgba(245,108,108,0.5); }

.gear-hint {
  font-size: 11px; color: #f56c6c; font-weight: bold;
  white-space: nowrap; height: 14px; line-height: 14px;
  transition: opacity 0.2s;
}
.gear-hint.hidden { opacity: 0; }

button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; transition: all 0.2s; }
button:hover:not(:disabled) { background: #ecf5ff; color: var(--primary); border-color: var(--primary); }
button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
button:disabled { background: #f5f5f5; color: #c0c4cc; cursor: not-allowed; border-color: #e4e7ed; }
button.danger { color: var(--danger); border-color: #fbc4c4; }
button.danger:hover:not(:disabled) { background: #fef0f0; }
button.danger:disabled { color: #c0c4cc; border-color: #e4e7ed; }
.footer { padding: 10px 20px; background: #fafafa; border-top: 1px solid var(--border); font-size: 12px; color: #909399; }
</style>
</head>
<body>

<div class="container">
  <div class="header">线控系统测试装调</div>

  <div class="control-panel">
    <div class="control-row">
      <!-- 左转向灯：加id，用于互斥逻辑 -->
      <button id="light-left" onclick="toggleLight(this)">左转向灯</button>
      <!-- 右转向灯：加id，用于互斥逻辑 -->
      <button id="light-right" onclick="toggleLight(this)">右转向灯</button>
      <!-- 关闭：保持原有id -->
      <button id="light-off" onclick="toggleLight(this)" class="active">关闭</button>
      <!-- 双闪：加id，用于优先级控制 -->
      <button id="light-hazard" onclick="toggleLight(this)">双闪</button>
      <!-- 喇叭：长按触发 -->
      <button id="horn-btn"
        onmousedown="startHorn(this)" 
        onmouseup="stopHorn(this)" 
        onmouseleave="stopHorn(this)"
        ontouchstart="startHorn(this)" 
        ontouchend="stopHorn(this)">喇叭</button>
      <!-- 近光灯：独立控制，不参与转向互斥 -->
      <button onclick="toggleLight(this)">近光灯</button>
    </div>

    <div class="control-row">
      <div class="gear-wrapper">
        <div class="gear-display gear-p" id="gear-display">P</div>
        <div class="gear-hint" id="gear-hint">电子手刹已激活</div>
      </div>
      <button onclick="setGear('P', this)" class="active">P</button>
      <button onclick="setGear('R', this)">R</button>
      <button onclick="setGear('N', this)">N</button>
      <button onclick="setGear('D', this)">D</button>
      <button class="danger" id="btn-accel" onclick="accelerate()" disabled>加速</button>
      <button class="danger" id="btn-decel" onclick="decelerate()" disabled>减速</button>
    </div>
  </div>

  <div class="footer" id="footer-log">TextLabel: 系统就绪 | 等待连接 CAN 设备...</div>
</div>

<script>
  let currentGear = 'P';

  // 与 Python 通信的桥接函数
  function callPython(action, payload) {
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.on_action(action, payload);
    } else {
      console.log('[前端模拟]', action, payload);
    }
  }

  // ==========================================
  // 灯光控制逻辑（双闪优先，左右互斥）
  // ==========================================
  function toggleLight(btn) {
    // 获取所有相关按钮的引用，方便操作
    const leftBtn = document.getElementById('light-left');
    const rightBtn = document.getElementById('light-right');
    const offBtn = document.getElementById('light-off');
    const hazardBtn = document.getElementById('light-hazard');

    // 1. 处理“关闭”按钮：清空所有灯光按钮的高亮状态
    if (btn.id === 'light-off') {
      document.querySelectorAll('.control-row:first-child button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      callPython('light', 'off');
      return;
    }

    // 2. 处理“双闪”按钮：双闪优先级最高
    if (btn.id === 'light-hazard') {
      const isActive = btn.classList.toggle('active');
      if (isActive) {
        // 双闪亮起时，强制关闭左转、右转和“关闭”状态
        if (leftBtn) leftBtn.classList.remove('active');
        if (rightBtn) rightBtn.classList.remove('active');
        if (offBtn) offBtn.classList.remove('active');
        callPython('light', 'hazard:on');
      } else {
        callPython('light', 'hazard:off');
      }
      return;
    }

    // 3. 处理“左转”和“右转”按钮：左右互斥，且会关闭双闪
    if (btn.id === 'light-left' || btn.id === 'light-right') {
      const isActive = btn.classList.toggle('active');
      if (isActive) {
        // 转向灯亮起时，关闭双闪、另一个转向灯和“关闭”状态
        if (hazardBtn) hazardBtn.classList.remove('active');
        if (btn.id === 'light-left' && rightBtn) rightBtn.classList.remove('active');
        if (btn.id === 'light-right' && leftBtn) leftBtn.classList.remove('active');
        if (offBtn) offBtn.classList.remove('active');
        callPython('light', btn.innerText + ':on');
      } else {
        callPython('light', btn.innerText + ':off');
      }
      return;
    }

    // 4. 处理其他独立灯光（如近光灯）：独立切换，不影响转向逻辑
    btn.classList.toggle('active');
    if (offBtn) offBtn.classList.remove('active');
    callPython('light', btn.innerText + (btn.classList.contains('active') ? ':on' : ':off'));
  }

  // ==========================================
  // 档位控制逻辑
  // ==========================================
  function setGear(gear, btn) {
    currentGear = gear;
    const display = document.getElementById('gear-display');
    display.innerText = gear;
    display.className = 'gear-display gear-' + gear.toLowerCase();

    // 仅在 P 档显示电子手刹提示
    const hint = document.getElementById('gear-hint');
    hint.classList.toggle('hidden', gear !== 'P');

    // 档位按钮单选高亮
    const parent = btn.parentElement;
    parent.querySelectorAll('button').forEach(b => {
      if (['P','R','N','D'].includes(b.innerText)) b.classList.remove('active');
    });
    btn.classList.add('active');

    // 根据档位控制加速/减速按钮的状态
    const accelBtn = document.getElementById('btn-accel');
    const decelBtn = document.getElementById('btn-decel');

    if (gear === 'D') {
      accelBtn.innerText = '加速'; decelBtn.innerText = '减速';
      accelBtn.disabled = false; decelBtn.disabled = false;
    } else if (gear === 'R') {
      accelBtn.innerText = '倒车加速'; decelBtn.innerText = '倒车减速';
      accelBtn.disabled = false; decelBtn.disabled = false;
    } else {
      accelBtn.innerText = '加速'; decelBtn.innerText = '减速';
      accelBtn.disabled = true; decelBtn.disabled = true;
    }

    callPython('gear', gear);
  }

  // ==========================================
  // 加速/减速逻辑
  // ==========================================
  function accelerate() {
    if (currentGear === 'D') callPython('accel', 'forward');
    else if (currentGear === 'R') callPython('accel', 'reverse');
    else if (currentGear === 'N') alert('空挡无法加速，请先挂 D 或 R 档');
    else if (currentGear === 'P') alert('驻车档无法加速，请先挂 N 档解除驻车');
  }

  function decelerate() {
    if (currentGear === 'D') callPython('decel', 'forward');
    else if (currentGear === 'R') callPython('decel', 'reverse');
    else if (currentGear === 'N') alert('空挡无法减速，请先挂 D 或 R 档');
    else if (currentGear === 'P') alert('驻车档无法减速，请先挂 N 档解除驻车');
  }

  // ==========================================
  // 喇叭长按逻辑
  // ==========================================
  function startHorn(btn) {
    btn.classList.add('active');        // 视觉上变蓝
    callPython('light', 'horn:on');     // 告诉 Python 喇叭响
  }

  function stopHorn(btn) {
    btn.classList.remove('active');     // 视觉上恢复
    callPython('light', 'horn:off');    // 告诉 Python 喇叭停
  }
</script>
</body>
</html>
